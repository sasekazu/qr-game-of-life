<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toad Hunt</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">

<style>
  :root { --bg:#f2f2f2; --card:#fff; --ink:#111; --sub:#8a8a8a; --line:#e2e2e2; }
  html { overflow-y: scroll; }   /* same width with or without a scrollbar, so the header stays put when switching modes */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 32px 16px;
  }
  .logo { width: 24px; height: 24px; flex: none; image-rendering: pixelated; }
  h1 #appSub:not(:empty) { font-size: 10px; font-weight: 500; letter-spacing: .18em; opacity: .65; }
  h1 { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--sub); }
  .modes { display: inline-flex; gap: 2px; margin-top: 10px; padding: 3px; border-radius: 999px; background: #e6e6e6; }
  .modes a { padding: 4px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--sub); text-decoration: none; }
  .modes a:hover { color: var(--ink); }
  .modes a[aria-current="page"] { background: var(--ink); color: #fff; }
  .modes a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .subtitle { margin: 2px 0 0; font-size: 11px; letter-spacing: .08em; color: var(--sub); text-align: center; }
  .card {
    width: min(100%, 640px);
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 32px rgba(0,0,0,.06);
    padding: 12px;
  }
  .input { display: flex; gap: 10px; align-items: center; }
  #text {
    flex: 1; min-width: 0; height: 48px; border: 0; outline: 0;
    padding: 0 16px; font: inherit; font-size: 16px; color: var(--ink);
    background: #f4f4f4; border-radius: 14px;
  }
  #text::placeholder { color: var(--sub); }
  #text:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button svg { display: block; }
  button.go { width: 56px; height: 48px; padding: 0; border-radius: 14px; }
  button.icon { width: 38px; height: 38px; padding: 0; border-radius: 12px; }
  button.lang { height: 38px; padding: 0 12px; border-radius: 12px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .gen { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  #qr {
    width: 64px; height: 64px; flex: none;
    image-rendering: pixelated; border-radius: 10px; border: 1px solid var(--line); background: #fff;
  }
  .hintrow { display: flex; justify-content: space-between; gap: 12px; margin: 8px 4px 0; }
  .hint { margin: 0; font-size: 12.5px; color: var(--sub); }
  .count { flex: none; font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .count.over, .count.full { color: var(--ink); font-weight: 600; }
  .hint.err { color: var(--ink); font-weight: 600; }
  .stage { position: relative; margin-top: 12px; }
  #life {
    position: relative; overflow: hidden; width: min(100%, 64vh); margin: 0 auto; aspect-ratio: 1;
    border-radius: 12px; background: #fafafa;
  }
  #life canvas { display: block; }
  .fx-flash { position: absolute; inset: 0; pointer-events: none; }
  .fx-label {
    position: absolute; pointer-events: none; white-space: nowrap;
    padding: 6px 16px; border-radius: 999px; border: 2px solid;
    background: var(--ink); color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .04em;
  }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; padding: 12px 8px 2px; color: var(--sub); font-size: 13px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    border: 0; border-radius: 999px; padding: 7px 16px;
    background: var(--ink); color: #fff;
  }
  button.ghost { background: #efefef; color: var(--ink); }
  button:not(:disabled):hover { opacity: .85; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  #log {
    list-style: none; margin: 8px 0 0; padding: 4px 8px 8px;
    height: 132px; overflow-y: auto; border-top: 1px solid var(--line);
    font: 13px/1.9 ui-monospace, "SF Mono", Consolas, monospace;
  }
  #log:empty::before { content: attr(data-empty); color: var(--sub); }
  #log li { display: flex; gap: 14px; }
  #log .g { color: var(--sub); font-variant-numeric: tabular-nums; }
  #log .g { display: inline-flex; align-items: center; gap: 5px; }
  #log li > span:first-child { min-width: 4.5em; }
  #log .s { letter-spacing: .1em; }
  #log .r1 .s { color: #3b82f6; }
  #log .r2 .s { color: #10b981; }
  #log .r3 .s { color: #f59e0b; }
  #log .r4 .s { color: #ef4444; }
  #log .r5 .s { color: #a855f7; }
  #log .s i { font-style: normal; color: var(--line); }
  #log li:not(.r4):not(.r5) .n { color: #555; }
  #log li.r4 .n, #log li.r5 .n { font-weight: 700; }
  #log li.r5 { background: var(--ink); color: #fff; border-radius: 6px; margin: 2px 0; padding: 0 8px; }
  #log li.r5 .g { color: #aaa; }
  #log li.r5 .s i { color: #555; }
  dialog {
    border: 0; border-radius: 20px; padding: 0; width: min(92vw, 460px); max-height: 82vh;
    color: var(--ink); background: var(--card);
    box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 24px 64px rgba(0,0,0,.25);
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(17,17,17,.35); }
  .guide-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 6px 22px; }
  .guide-head h2 { margin: 0; font-size: 15px; letter-spacing: .04em; }
  #guideList { list-style: none; margin: 0; padding: 4px 14px 16px; overflow-y: auto; }
  #guideList li { display: flex; align-items: center; gap: 16px; padding: 10px 6px; border-top: 1px solid var(--line); }
  #guideList li:first-child { border-top: 0; }
  #guideList .thumb { width: 72px; height: 72px; flex: none; display: grid; place-items: center; background: #f4f4f4; border-radius: 12px; }
  #guideList .info { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
  #guideList .r4 .n, #guideList .r5 .n { font-weight: 700; }
  #guideList .s { letter-spacing: .12em; font-size: 14px; }
  #guideList .s i { font-style: normal; color: var(--line); }
  #guideList .r1 .s { color: #3b82f6; }
  #guideList .r2 .s { color: #10b981; }
  #guideList .r3 .s { color: #f59e0b; }
  #guideList .r4 .s { color: #ef4444; }
  #guideList .r5 .s { color: #a855f7; }
  .progress { position: relative; width: min(100%, 64vh); height: 6px; margin: 12px auto 0; border-radius: 999px; background: #e9e9e9; overflow: hidden; }
  .progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); border-radius: 999px; transition: width .12s linear; }
  .progress .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--card); }
  .progress.final i { background: #a855f7; }                          /* the last 10%: the end is near */
  .progress.final:not(.done) i { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .progress i { animation: none !important; transition: none; } }
  .of { color: var(--sub); font-weight: 400; }
  .of::before { content: "\00a0"; }
  .stats { display: flex; align-items: center; gap: 18px; }
  #score { display: inline-block; color: var(--ink); font-weight: 600; }
  #score.bump { animation: bump .4s ease-out; }
  @keyframes bump { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  .result {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; background: rgba(250,250,250,.88); backdrop-filter: blur(3px);
  }
  .result[hidden] { display: none; }
  .res-icon { color: var(--ink); }
  .res-score { font-size: 56px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .res-line { font-size: 15px; font-weight: 600; }
  .res-line.new { color: #a855f7; }
  .res-why { font-size: 12.5px; color: var(--sub); padding: 0 24px; text-align: center; }
  .res-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; }
  #shareX, #shareCopy { height: 38px; padding: 0 14px; border-radius: 12px; font-size: 13px; white-space: nowrap; }
  #shareX { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; text-decoration: none; }
  #shareX:hover { opacity: .85; }
  #shareX:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #log { overflow-x: hidden; }
  #log .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log .p { margin-left: auto; color: var(--sub); font-variant-numeric: tabular-nums; }
  #log li.r5 .p { color: #aaa; }
  #guideList .pts { margin-left: auto; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; }
  @media (max-width: 440px) {                                         /* phones: keep the button row on one line */
    .btns { gap: 4px; }
    button.icon { width: 34px; height: 34px; }
    button.lang { height: 34px; padding: 0 8px; }
    button.lang span { display: none; }                               /* the globe alone; the language is in its tooltip */
    #log li { gap: 8px; min-width: 0; }
    #log li > span:first-child { min-width: 3.4em; }
    #log .s { letter-spacing: .04em; }
  }
  /* demo autoplay: a quiet tag on the board, with a way out */
  .demo[hidden] { display: none; }
  .demo { position: absolute; z-index: 2; left: 8px; right: 8px; top: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none; font-size: 11.5px; letter-spacing: .06em; color: var(--sub); }
  .demo .tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.85); border: 1px solid var(--line); }
  .demo button { flex: none; margin-left: auto; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; pointer-events: auto; }
  .note[hidden] { display: none; }
  .note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sub); pointer-events: none; }
  /* online ranking */
  .post { display: flex; gap: 6px; margin-top: 10px; width: min(86%, 300px); }
  .post[hidden], .post-msg[hidden], #rankBtn[hidden] { display: none; }
  .post input {
    flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; padding: 0 12px;
    font: inherit; font-size: 14px; color: var(--ink); background: #fff; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line);
  }
  .post input:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
  .post button { height: 36px; border-radius: 12px; }
  .post-msg { margin: 6px 24px 0; font-size: 12.5px; color: var(--sub); text-align: center; }
  #rankList { list-style: none; margin: 0; padding: 0 14px 6px; overflow-y: auto; min-height: 120px; }
  #rankList li { display: flex; align-items: baseline; gap: 12px; padding: 9px 8px; border-top: 1px solid var(--line); font-size: 15px; }
  #rankList li:first-child { border-top: 0; }
  #rankList .no { width: 1.8em; flex: none; color: var(--sub); font-variant-numeric: tabular-nums; text-align: right; }
  #rankList .nm { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rankList .pt { font-weight: 600; font-variant-numeric: tabular-nums; }
  #rankList .dt { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  #rankList li.mine { background: var(--ink); color: #fff; border-radius: 10px; }
  #rankList li.mine .no, #rankList li.mine .dt { color: #aaa; }
  #rankList li.msg { display: block; border: 0; color: var(--sub); text-align: center; padding: 28px 8px; }
  .rank-foot { display: flex; justify-content: flex-end; padding: 4px 14px 14px; }
</style>
</head>
<body>
  <header style="text-align:center">
    <h1><img class="logo" src="logo.svg" alt="" width="24" height="24"><span id="appName">Toad Hunt</span><span id="appSub"></span></h1>
    <p class="subtitle">A QR Game of Life Challenge</p>
    <nav class="modes" aria-label="Mode"><a id="modeSingle" href="index.html" aria-current="page"></a><a id="modeBattle" href="battle.html"></a></nav>
  </header>
  <main class="card">
    <div class="input">
      <input id="text" type="text" placeholder="Type text or a URL…" spellcheck="false" autocomplete="off" enterkeyhint="go" autofocus>
      <button id="go" class="go" aria-label="Start"></button>
      <canvas id="qr" width="1" height="1" aria-label="QR code preview"></canvas>
    </div>
    <div class="hintrow"><p class="hint" id="hint"></p><span class="count" id="count"></span></div>
    <div class="stage">
      <div id="life" role="img" aria-label="Game of Life">
        <div class="result" id="result" hidden>
          <div class="res-icon" id="resIcon"></div>
          <div class="res-score" id="resScore"></div>
          <div class="res-line" id="resLine"></div>
          <div class="res-why" id="resWhy"></div>
          <form class="post" id="post" hidden autocomplete="off">
            <input id="postName" type="text" maxlength="16" spellcheck="false" enterkeyhint="send">
            <button id="postGo" type="submit"></button>
          </form>
          <div class="post-msg" id="postMsg" hidden></div>
          <div class="res-actions">
            <button id="again" class="ghost icon"></button>
            <a id="shareX" target="_blank" rel="noopener noreferrer"></a>
            <button id="shareCopy" class="ghost" type="button"></button>
          </div>
        </div>
      </div>
      <div class="note" id="note"></div>
      <div class="demo" id="demo" hidden><span class="tag" id="demoTag"></span><button id="demoSkip" class="ghost"></button></div>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0">
      <i id="progressFill"></i><b class="tick" style="left:25%"></b><b class="tick" style="left:50%"></b><b class="tick" style="left:75%"></b>
    </div>
    <div class="bar">
      <span class="stats">
        <span class="gen" id="genbox"><span id="genicon"></span><span id="gen">0</span><span class="of" id="genMax"></span></span>
        <span class="gen" id="scorebox"><span id="scoreicon"></span><span id="score">0</span></span>
      </span>
      <span class="btns">
        <button id="guideBtn" class="ghost icon"></button>
        <button id="rankBtn" class="ghost icon" hidden></button>
        <button id="lang" class="ghost lang"></button>
        <button id="snd" class="ghost icon" aria-pressed="true"></button>
        <button id="reset" class="ghost icon" disabled></button>
      </span>
    </div>
    <ul id="log"></ul>
  </main>

  <dialog id="guide">
    <div class="guide-head"><h2 id="guideTitle"></h2><button id="guideClose" class="ghost icon"></button></div>
    <ul id="guideList"></ul>
  </dialog>

  <dialog id="rankDlg">
    <div class="guide-head"><h2 id="rankTitle"></h2><button id="rankClose" class="ghost icon"></button></div>
    <ul id="rankList" aria-live="polite"></ul>
    <div class="rank-foot"><button id="rankRefresh" class="ghost icon"></button></div>
  </dialog>

<script type="module">
import * as THREE from "three";

/* ===================== QR code encoder (byte mode, versions 1-40) ===================== */
const QR = (() => {
  const ECC_PER_BLOCK = [
    [-1,  7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  ];
  const NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4,  4,  4,  4,  4,  6,  6,  6,  6,  7,  8,  8,  9,  9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5,  5,  8,  9,  9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8,  8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  ];
  const FORMAT_BITS = [1, 0, 3, 2]; // L, M, Q, H

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = (ver, ecl) =>
    Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
  const countBits = ver => (ver <= 9 ? 8 : 16);
  const maxBytes = (ver, ecl) => Math.floor((dataCodewords(ver, ecl) * 8 - 4 - countBits(ver)) / 8);

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function rsDivisor(deg) {
    const res = new Array(deg).fill(0);
    res[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < deg; j++) {
        res[j] = gfMul(res[j], root);
        if (j + 1 < deg) res[j] ^= res[j + 1];
      }
      root = gfMul(root, 2);
    }
    return res;
  }
  function rsRemainder(data, divisor) {
    const res = divisor.map(() => 0);
    for (const b of data) {
      const f = b ^ res.shift();
      res.push(0);
      divisor.forEach((c, i) => { res[i] ^= gfMul(c, f); });
    }
    return res;
  }

  // `fixedVer` (optional) forces that QR version, so every input gives a grid of the same size
  function encode(bytes, ecl, fixedVer = 0) {
    let ver = fixedVer || 1;
    if (fixedVer) { if (bytes.length > maxBytes(ver, ecl)) throw new RangeError("too long"); }
    else {                                                          // otherwise the smallest version that fits
      while (ver <= 40 && bytes.length > maxBytes(ver, ecl)) ver++;
      if (ver > 40) throw new RangeError("too long");
    }

    // bit stream: mode(0100) + count + data + terminator + pad
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4);
    put(bytes.length, countBits(ver));
    for (const b of bytes) put(b, 8);
    const capBits = dataCodewords(ver, ecl) * 8;
    put(0, Math.min(4, capBits - bits.length));
    put(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < capBits; pad ^= 0xec ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      data.push(v);
    }

    // split into blocks, add RS ECC, interleave
    const nBlocks = NUM_BLOCKS[ecl][ver];
    const eccLen = ECC_PER_BLOCK[ecl][ver];
    const rawCw = Math.floor(rawModules(ver) / 8);
    const nShort = nBlocks - (rawCw % nBlocks);
    const shortLen = Math.floor(rawCw / nBlocks);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;

/* ===================== Game of Life ===================== */
const $ = id => document.getElementById(id);

const logEl = $("log");

/* ---- Three.js scene ---- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 4000);   // no perspective: a true 2D plan view

scene.add(new THREE.HemisphereLight(0xffffff, 0x8c8c8c, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(0.5, 1, 0.7);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xfafafa }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

// The edge of the world: a slightly darker board with a thin frame (the board wraps around, so this is where it does)
const board = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xf0f0f0 }));
board.rotation.x = -Math.PI / 2;
board.position.y = -0.005;
scene.add(board);
const FRAME_T = 0.35;                                  // frame thickness, in cells
const frameMat = new THREE.MeshBasicMaterial({ color: 0xc4c4c4 });
const edgeStrips = [0, 1, 2, 3].map(() => {

});
function layoutWorldEdge(n) {
  board.scale.set(n, n, 1);
  const half = n / 2 + FRAME_T / 2, len = n + FRAME_T * 2;
  // [centre x, centre z, width, depth] of the top, bottom, left and right strips
  [[0, -half, len, FRAME_T], [0, half, len, FRAME_T], [-half, 0, FRAME_T, n], [half, 0, FRAME_T, n]].forEach(([x, z, w, d], i) => {
    edgeStrips[i].position.set(x, 0.01, z);

const cellGeo = new THREE.BoxGeometry(0.92, 1, 0.92);
const cellMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 });   // colour comes per instance
const TINT = RANK_COLORS.map(h => new THREE.Color(h));

let tint = new Uint8Array(0);                        // 0 = plain, 1..5 = part of a detected pattern of that rank

const GHOST = new THREE.Color(0xc6c6c6);

let viewAspect = 1;
// the visible area is the whole board plus a small margin, whatever the shape of the box
function fitCamera() {
  if (!N) return;
  const half = N * 0.56 * Math.max(1, 1 / viewAspect);
  camera.top = half; camera.bottom = -half;
  camera.left = -half * viewAspect; camera.right = half * viewAspect;
  camera.updateProjectionMatrix();
}

function resize() {
  const w = life.clientWidth, h = life.clientHeight;

  renderer.setSize(w, h);

}
new ResizeObserver(resize).observe(life);
resize();

function buildGrid(n) {
  if (mesh) { scene.remove(mesh); mesh.dispose(); }
  mesh = new THREE.InstancedMesh(cellGeo, cellMat, n * n);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  const a = mesh.instanceMatrix.array;
  for (let i = 0; i < n * n; i++) a[i * 16 + 15] = 1;
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * n * 3), 3);
  mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);

  placeCamera();
}

// fixed view: straight down, whole board in frame (no mouse control)
function placeCamera() {
  fitCamera();
  camera.position.set(0, N * 3.15, 0.001);   // the distance does not change the size (orthographic)
  camera.lookAt(0, 0, 0);
}

// ease every cell toward alive(1) / dead(0) and its pattern colour, and write its transform
function animateCells(dt, force = false) {
  if (!mesh) return;
  const k = 1 - Math.exp(-dt * 30), kc = 1 - Math.exp(-dt * 20);
  const a = mesh.instanceMatrix.array, c = mesh.instanceColor.array, o = N / 2 - 0.5;
  let dirty = false, cDirty = false;
  for (let i = 0; i < N * N; i++) {
    const t = cur[i];
    let s = cellScale[i];
    if (s !== t || force) {
      s += (t - s) * k;
      if (Math.abs(t - s) < 0.003) s = t;
      cellScale[i] = s;
      const x = i % N, z = (i - x) / N, j = i * 16;
      a[j] = a[j + 10] = s;
      a[j + 5] = s * CELL_H;
      a[j + 12] = x - o;
      a[j + 13] = s * CELL_H / 2;
      a[j + 14] = z - o;
      dirty = true;
    }
    // colour: invisible (nearly dead) cells snap to their target, visible ones fade
    const tc = ghost ? GHOST : TINT[tint[i]], j3 = i * 3;
    const dr = tc.r - c[j3], dg = tc.g - c[j3 + 1], db = tc.b - c[j3 + 2];
    if (dr || dg || db) {
      const f = s < 0.05 || force ? 1 : kc;
      c[j3] += dr * f; c[j3 + 1] += dg * f; c[j3 + 2] += db * f;
      if (Math.abs(dr) + Math.abs(dg) + Math.abs(db) < 0.004) { c[j3] = tc.r; c[j3 + 1] = tc.g; c[j3 + 2] = tc.b; }
      cDirty = true;
    }

}

function load(cells, n, asGhost = false) {
  const resized = n !== N || !mesh;
  ghost = asGhost;
  N = n; seed = cells; cur = Uint8Array.from(cells); nxt = new Uint8Array(n * n);

  tint = new Uint8Array(n * n);
  animateCells(0, true);

  resetScore();

}

/* ===================== Sound ===================== */
// A tiny synth (Web Audio, no audio files). The rarer the pattern, the longer, brighter and louder the sound.
const NOTE = m => 440 * 2 ** ((m - 69) / 12);                      // MIDI note number -> Hz

function tone(c, out, t0, f, dur, type, gain, slideTo = 0) {
  const o = c.createOscillator(), v = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  v.gain.setValueAtTime(0.0001, t0);
  v.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
  v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(v).connect(out);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function whoosh(c, out, t0, dur, gain) {                            // rising noise sweep
  const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(), bp = c.createBiquadFilter(), v = c.createGain();
  src.buffer = buf;
  bp.type = "bandpass"; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(300, t0);
  bp.frequency.exponentialRampToValueAtTime(5000, t0 + dur);
  v.gain.setValueAtTime(0.0001, t0);
  v.gain.exponentialRampToValueAtTime(gain, t0 + dur * 0.7);
  v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp).connect(v).connect(out);
  src.start(t0);
}

function voice(c, out, rank, t0) {
  switch (rank) {
    case 1:                                                         // a soft tick
      tone(c, out, t0, NOTE(76), 0.08, "sine", 0.11);
      break;
    case 2:                                                         // two quick soft notes
      tone(c, out, t0, NOTE(79), 0.1, "sine", 0.12);
      tone(c, out, t0 + 0.06, NOTE(84), 0.12, "sine", 0.1);
      break;
    case 3:                                                         // chime
      tone(c, out, t0, NOTE(76), 0.4, "triangle", 0.16);
      tone(c, out, t0 + 0.09, NOTE(83), 0.45, "triangle", 0.15);
      tone(c, out, t0 + 0.09, NOTE(95), 0.3, "sine", 0.05);
      break;
    case 4:                                                         // rising arpeggio
      [72, 76, 79, 84].forEach((m, i) => {
        tone(c, out, t0 + i * 0.075, NOTE(m), 0.4, "triangle", 0.14);
        tone(c, out, t0 + i * 0.075, NOTE(m + 12), 0.25, "sine", 0.04);
      });
      break;
    default:                                                        // fanfare: boom, whoosh, run, chord
      tone(c, out, t0, 110, 0.7, "sine", 0.4, 38);
      whoosh(c, out, t0, 0.6, 0.18);
      [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => {
        tone(c, out, t0 + 0.05 + i * 0.06, NOTE(m), 0.5, "sawtooth", 0.06);
        tone(c, out, t0 + 0.05 + i * 0.06, NOTE(m), 0.5, "triangle", 0.1);
      });
      [72, 76, 79, 84].forEach(m => {
        tone(c, out, t0 + 0.5, NOTE(m), 1.3, "sawtooth", 0.05);
        tone(c, out, t0 + 0.5, NOTE(m), 1.3, "triangle", 0.09);
      });
  }
}

let audio = null, master = null, soundOn = true;
const lastPlayed = {};
try { soundOn = localStorage.getItem("qrlife-sound") !== "off"; } catch (e) { /* storage unavailable: default on */ }

// browsers only allow audio after a user gesture, so this is called from the start / button handlers
function audioWake() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const comp = audio.createDynamicsCompressor();                  // keeps simultaneous sounds from clipping
    master = audio.createGain();
    master.gain.value = 0.7;
    master.connect(comp).connect(audio.destination);
  }

// comes back to the front gets its context woken again: browsers suspend it in the background
["pointerdown", "keydown", "touchend"].forEach(ev => addEventListener(ev, audioWake, { passive: true }));

const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;

    pos.set([x + Math.cos(a) * r, 0.9, z + Math.sin(a) * r], i * 3);

  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));

    color: TINT[rank], map: softTex, transparent: true, depthWrite: false,
    sizeAttenuation: false, size: (rank >= 5 ? 14 : 10) * renderer.getPixelRatio(),

    kill,
    tick(dt) {

      if (t >= dur) { kill(); return false; }

function makeGlow(p) {

function tickGlows(dt) {
  const k = 1 - Math.exp(-dt * 12), kf = 1 - Math.exp(-dt * 6), pulse = 0.5 + 0.5 * Math.sin(clock * 5);
  for (const p of tracked) {
    const m = p.glow;
    if (!m) continue;
    const [x, z] = toWorld(p.cx, p.cy), s = p.size + 6 + p.rank * 2;
    // wrapped around the board: jump instead of sliding across it
    if (Math.abs(x - m.position.x) > N / 2) m.position.x = x;
    if (Math.abs(z - m.position.z) > N / 2) m.position.z = z;
    m.position.x += (x - m.position.x) * k;
    m.position.z += (z - m.position.z) * k;
    m.scale.x += (s - m.scale.x) * k; m.scale.y = m.scale.x;
    m.material.opacity += ((p.rank >= 4 ? 0.55 + 0.2 * pulse : 0.4 + 0.12 * pulse) - m.material.opacity) * kf;
  }
  for (let i = fading.length - 1; i >= 0; i--) {
    const m = fading[i];
    m.material.opacity -= m.material.opacity * kf;
    if (m.material.opacity < 0.01) { disposeGlow(m); fading.splice(i, 1); }
  }
}

// The name sits just outside the pattern, above it (or below when there is no room above), and only ever drifts
// further away, so the text never covers the pattern it names.
function showLabel(name, x, z, rank, size) {
  camera.updateMatrixWorld();
  const W = life.clientWidth, H = life.clientHeight, half = size / 2 + 0.7;          // 0.7: the cell's own half size + a little air
  const project = (px, pz) => {                                                     // world -> pixels inside the board box
    const v = new THREE.Vector3(px, 1, pz).project(camera);
    return [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H];
  };
  const el = document.createElement("div");
  el.className = "fx-label";
  el.textContent = name;
  el.style.borderColor = RANK_COLORS[rank];
  life.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight, gap = 6;
  const [cx, topY] = project(x, z - half), botY = project(x, z + half)[1];            // the pattern's top / bottom edge on screen
  const above = topY - gap - h >= 4;
  el.style.left = Math.min(W - w / 2 - 4, Math.max(w / 2 + 4, cx)) + "px";
  el.style.top = (above ? topY - gap : botY + gap) + "px";
  const base = above ? "translate(-50%,-100%)" : "translate(-50%,0)";
  const away = above ? " translateY(-10px)" : " translateY(10px)";
  el.animate(REDUCED_MOTION ? [                                                      // no movement for "reduce motion": it only fades
    { opacity: 0, transform: base }, { opacity: 1, transform: base, offset: 0.15 },
    { opacity: 1, transform: base, offset: 0.75 }, { opacity: 0, transform: base },
  ] : [
    { opacity: 0, transform: base + " scale(.9)" },
    { opacity: 1, transform: base + " scale(1)", offset: 0.15 },
    { opacity: 1, transform: base + " scale(1)", offset: 0.75 },
    { opacity: 0, transform: base + away },
  ], { duration: 1900, easing: "ease-out" }).onfinish = () => el.remove();
}

function flash(rank) {
  const el = document.createElement("div");
  el.className = "fx-flash";
  el.style.background = RANK_COLORS[rank];
  life.appendChild(el);
  el.animate([{ opacity: 0.4 }, { opacity: 0 }], { duration: 650, easing: "ease-out" }).onfinish = () => el.remove();
}

function shake() {
  life.animate([
    { transform: "translate(0,0)" }, { transform: "translate(-4px,2px)" }, { transform: "translate(4px,-2px)" },
    { transform: "translate(-3px,-2px)" }, { transform: "translate(2px,3px)" }, { transform: "translate(0,0)" },
  ], { duration: 380 });
}

// brief automatic pause (the stop button is untouched, so a manual pause is never overridden)
let holdTimer = 0;
function holdGame(ms) {
  clearTimeout(holdTimer);
  holding = true;
  holdTimer = setTimeout(() => { holding = false; }, ms);
}

function celebrate(p) {
  const [x, z] = toWorld(p.cx, p.cy), r = p.rank;
  playRank(r);
  if (r >= 3) holdGame(1000);
  if (r >= 3) showLabel(patName(p.name), x, z, r, p.size);                    // whatever freezes the game also gets its name shown
  if (r >= 3) addRipple(x, z, r, p.size);
  if (r >= 4) addRipple(x, z, r, p.size, 0.15);
  if (r >= 5) addRipple(x, z, r, p.size, 0.3);
  if (r >= 5) addBurst(x, z, r, p.size);
  if (r >= 4 && !REDUCED_MOTION) shake();
  if (r >= 5 && !REDUCED_MOTION) flash(r);
}

function tickFx(dt) {
  clock += dt;
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i].tick(dt)) fx.splice(i, 1);
  tickGlows(dt);
}

function draw() {
  $("gen").textContent = gen;
  updateProgress();
}

// how far the game is: the bar fills up to GAME_GENS; the last 10% turns purple and pulses until the game is over
function updateProgress() {
  const bar = $("progress"), frac = finished ? 1 : Math.min(1, gen / GAME_GENS);   // an early end fills the bar too
  $("progressFill").style.width = (frac * 100) + "%";
  bar.classList.toggle("final", frac >= 0.9);
  bar.classList.toggle("done", frac >= 1);
  bar.setAttribute("aria-valuemax", GAME_GENS);
  bar.setAttribute("aria-valuenow", Math.min(gen, GAME_GENS));
  bar.title = `${Math.min(gen, GAME_GENS)} / ${GAME_GENS}`;
}

function lifeStep(src, dst, n) {
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (dx || dy) c += src[((y + dy + n) % n) * n + (x + dx + n) % n];
    const i = y * n + x;
    dst[i] = c === 3 || (src[i] && c === 2) ? 1 : 0;
  }
}

function step() {
  lifeStep(cur, nxt, N);
  [cur, nxt] = [nxt, cur];
  gen++;
  detect();
  if (gen >= GAME_GENS) finish("limit");
  else {
    const k = stateKey();
    if (seenStates.has(k)) finish("settled");            // back to an earlier state: the board only repeats itself
    else seenStates.set(k, gen);
  }
}

/* ---- scoring ---- */
// Every new appearance of a pattern scores points by its rank: 1, 3, 9, 27, 81. The ranks are a ladder in which each
// step is about 3x rarer (see PATTERNS), so each rank is worth about the same in total and hunting for rare patterns
// pays. A game lasts GAME_GENS generations, but ends earlier once the board only repeats itself: when it comes back to
// a state it has already been in, it is stuck in a cycle (still lifes, oscillators, gliders circling the wrapping board)
// and nothing new can ever appear. The game is deterministic: the same text on the same class always gives the same
// score, so the way to score higher is to find a better text.
const POINTS = [0, 1, 3, 9, 27, 81];
const GAME_GENS = 1000;
let score = 0, finished = false, resultInfo = null;
let found = {};                       // pattern id -> how many times it appeared this game (the log is capped, this is not)
const seenStates = new Map();
function stateKey() {
  let h = 2166136261, pop = 0;
  for (let i = 0; i < cur.length; i++) { h = Math.imul(h ^ cur[i], 16777619); pop += cur[i]; }
  return (h >>> 0).toString(36) + ":" + pop;
}
function resetScore() {
  score = 0; finished = false; resultInfo = null; found = {};
  seenStates.clear();
  $("score").textContent = 0;
  renderResult();
}
function addScore(points) {
  score += points;
  const el = $("score");
  el.textContent = score;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");   // restart the little pop animation
}
function finish(reason) {
  finished = true; running = false; holding = false;
  if (demo) { syncButtons(); scheduleDemoReplay(); return; }   // the demo keeps no best, no result, no sound, no ranking
  const key = "qrlife-best-" + boardClass;
  let prev = 0;
  try { prev = +localStorage.getItem(key) || 0; } catch (e) { /* storage unavailable */ }
  const isBest = score > prev;
  if (isBest) { try { localStorage.setItem(key, score); } catch (e) { /* ignore */ } }
  resultInfo = { score, best: Math.max(prev, score), isBest, reason, gen, cls: boardClass, top: topPatterns() };
  renderResult();
  syncButtons();
  playRank(isBest ? 5 : 3);
  offerPost();                                        // online ranking (defined further down; does nothing when it is off)
}
function renderResult() {
  const box = $("result"), t = T();
  box.hidden = !resultInfo;
  if (!resultInfo) return;
  $("resScore").textContent = resultInfo.score;
  const line = $("resLine");
  line.textContent = resultInfo.isBest ? t.newBest : t.best(resultInfo.best);
  line.classList.toggle("new", resultInfo.isBest);
  $("resWhy").textContent = resultInfo.reason === "limit" ? t.endLimit(GAME_GENS) : t.endSettled(resultInfo.gen);
  renderShare();
}

/* ---- sharing ---- */
// The post is built from the score, the board class, the best pattern and a constant URL ONLY. The game is deterministic
// (same text -> same score), so the input text, the QR code and anything derived from them are never shared, and the
// link is the plain top page (no query, no hash). Sharing never touches the ranking (see offerPost()).
const SHARE_URL = "https://sasekazu.github.io/toad-hunt/";
const SHARE_PATTERNS = 3;                             // kinds listed at least (more only when the rarest rank has more kinds)
function topPatterns() {                              // [{ id, count }]: every kind of the rarest rank, then the next rarest up to SHARE_PATTERNS
  const all = Object.keys(found).map(id => ({ id, rank: rankOf(id), count: found[id] }))
    .sort((a, b) => b.rank - a.rank || b.count - a.count);
  if (!all.length) return [];
  const top = all.filter(p => p.rank === all[0].rank), rest = all.slice(top.length);
  return top.concat(rest.slice(0, Math.max(0, SHARE_PATTERNS - top.length))).map(p => ({ id: p.id, count: p.count }));
}
function shareText() {
  const t = T().share, r = resultInfo;
  return [
    t.score(r.score.toLocaleString("en-US")),
    ...r.top.map(p => `${patName(p.id)}${p.count > 1 ? ` × ${p.count}` : ""}`),
    t.cta,
    "#ToadHunt",
    SHARE_URL,
  ].join("\n");
}
function renderShare() {
  if (!resultInfo) return;                            // (the "Copied!" timer can fire after a new game began)
  const t = T().share;
  $("shareX").innerHTML = ICON.x(14) + `<span>${t.x}</span>`;
  $("shareCopy").textContent = t.copy;
  $("shareX").href = "https://x.com/intent/post?text=" + encodeURIComponent(shareText());   // the compose box stays editable
}
async function copyShare() {
  const text = shareText(), btn = $("shareCopy");
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {                                         // no Clipboard API (plain http, old browsers): the old way
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { /* ignore */ }
    ta.remove();
  }
  btn.textContent = ok ? T().share.copied : T().share.copyFail;
  clearTimeout(copyShare.timer);
  copyShare.timer = setTimeout(renderShare, 1800);
}

/* ---- famous patterns ---- */
// [id, { small: rank, large: rank }, period, first phase]. A rank (1-5) is the rarity, set by how OFTEN the pattern
// appears (counted as in the log: a new appearance), as a ladder: about once per 1000 generations is rank 5, once per
// 300 is rank 4, once per 100 rank 3, once per 30 rank 2 and anything more frequent rank 1. Each class has its own
// ranks (a smaller board has fewer live cells, so everything is rarer there). The values come from
// `node tools/tally.cjs 1000 small|large` (~1100 QR "soups" of 1000 generations: every printable ASCII character plus
// random strings that fit); its "suggest" column is what to put here. Measure again after changing a class or the list.
const PATTERNS = [
  ["block", { small: 1, large: 1 }, 1, "OO/OO"],
  ["beehive", { small: 2, large: 1 }, 1, ".OO./O..O/.OO."],
  ["loaf", { small: 3, large: 2 }, 1, ".OO./O..O/.O.O/..O."],
  ["boat", { small: 3, large: 2 }, 1, "OO./O.O/.O."],
  ["ship", { small: 5, large: 4 }, 1, "OO./O.O/.OO"],
  ["tub", { small: 4, large: 3 }, 1, ".O./O.O/.O."],
  ["pond", { small: 4, large: 4 }, 1, ".OO./O..O/O..O/.OO."],
  ["blinker", { small: 2, large: 1 }, 2, "OOO"],
  ["toad", { small: 5, large: 5 }, 2, ".OOO/OOO."],
  ["beacon", { small: 5, large: 5 }, 2, "OO../OO../..OO/..OO"],
  ["pulsar", { small: 5, large: 5 }, 3, "..OOO...OOO../............./O....O.O....O/O....O.O....O/O....O.O....O/..OOO...OOO../............./..OOO...OOO../O....O.O....O/O....O.O....O/O....O.O....O/............./..OOO...OOO.."],
  ["glider", { small: 3, large: 2 }, 4, ".O./..O/OOO"],
  ["lwss", { small: 5, large: 5 }, 4, "O..O./....O/O...O/.OOOO"],
  ["snake", { small: 5, large: 5 }, 1, "OO.O/O.OO"],
  ["carrier", { small: 5, large: 5 }, 1, "OO../O..O/..OO"],
  ["barge", { small: 5, large: 5 }, 1, ".O../O.O./.O.O/..O."],
  ["longboat", { small: 5, large: 4 }, 1, "OO../O.O./.O.O/..O."],
  ["mango", { small: 5, large: 5 }, 1, ".OO../O..O./.O..O/..OO."],
  ["eater", { small: 5, large: 5 }, 1, "OO../O.O./..O./..OO"],
  ["clock", { small: 5, large: 5 }, 2, "..O./O.O./.O.O/.O.."],
  ["figure8", { small: 5, large: 5 }, 8, "OOO.../OOO.../OOO.../...OOO/...OOO/...OOO"],
  ["mwss", { small: 5, large: 5 }, 4, "..O.../O...O./.....O/O....O/.OOOOO"],
  ["hwss", { small: 5, large: 5 }, 4, "..OO.../O....O./......O/O.....O/.OOOOOO"],
  ["rpent", { small: 4, large: 3 }, 1, ".OO/OO./.O."],
];

// cell list -> orientation-independent-of-position key
const cellKey = cells => {
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  return cells.map(c => (c[1] - my) * 1000 + (c[0] - mx)).sort((a, b) => a - b).join(",");
};
const SYMS = [(x, y) => [x, y], (x, y) => [-x, y], (x, y) => [x, -y], (x, y) => [-x, -y],
              (x, y) => [y, x], (x, y) => [-y, x], (x, y) => [y, -x], (x, y) => [-y, -x]];

// every phase x every rotation/reflection -> name (phases are produced by simulating the pattern)
const KNOWN = new Map();
const RANKS = {};
const rankOf = id => RANKS[id][boardClass];   // rarity of a pattern in the current class
for (const [name, rank, period, art] of PATTERNS) {
  RANKS[name] = rank;
  const G = 48, a = new Uint8Array(G * G), b = new Uint8Array(G * G);
  art.split("/").forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "O") a[(y + 16) * G + x + 16] = 1; }));
  let s = a, t = b;
  for (let p = 0; p < period; p++) {
    const cells = [];
    s.forEach((v, i) => { if (v) cells.push([i % G, Math.floor(i / G)]); });
    for (const f of SYMS) KNOWN.set(cellKey(cells.map(([x, y]) => f(x, y))), name);
    lifeStep(s, t, G); [s, t] = [t, s];
  }
}

// groups of live cells (cells within 2 squares belong together), matched against KNOWN
function groups(grid, n) {
  const seen = new Uint8Array(n * n), out = [];
  for (let i = 0; i < grid.length; i++) {
    if (!grid[i] || seen[i]) continue;
    // The board is a torus, so a group can straddle an edge. Each cell carries "unwrapped"
    // coordinates [x, y] (relative to the group's first cell, may fall outside 0..n-1) plus its
    // real board index as a third element.
    const x0 = i % n, y0 = (i - x0) / n, cells = [], stack = [[x0, y0]];
    seen[i] = 1;
    while (stack.length) {
      const [ux, uy] = stack.pop();
      cells.push([ux, uy, (((uy % n) + n) % n) * n + (((ux % n) + n) % n)]);
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const vx = ux + dx, vy = uy + dy, k = (((vy % n) + n) % n) * n + (((vx % n) + n) % n);
        if (grid[k] && !seen[k]) { seen[k] = 1; stack.push([vx, vy]); }
      }
    }
    out.push(cells);
  }
  return out;
}

// every recognised pattern on the board right now (also paints `tint` by rank)
function findPatterns() {
  const found = [];
  tint.fill(0);
  for (const cells of groups(cur, N)) {
    if (cells.length > 100) continue;
    const name = KNOWN.get(cellKey(cells));
    if (!name) continue;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y, idx] of cells) {
      tint[idx] = rankOf(name);                            // colour the pattern by its rank
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    const mod = v => ((v % N) + N) % N;                  // centre of a group straddling an edge is brought back on board
    found.push({ name, rank: rankOf(name), cx: mod((x0 + x1) / 2), cy: mod((y0 + y1) / 2), size: Math.max(x1 - x0, y1 - y0) + 1 });
  }
  return found;
}

// Follow patterns from generation to generation: one that shows up where none of the same kind
// was a moment ago is "new" -> log it and (unless silent) celebrate it.
//
// Movers (glider, LWSS) are followed more carefully: the board wraps around, so one can vanish
// off an edge (or be unrecognisable while touching other cells) and come back elsewhere. A lost
// pattern is therefore remembered for a while, and may reappear within the distance it could
// have travelled in the meantime (edge wrap-around included) without counting as new.
const SPEED = { glider: 0.3, lwss: 0.55, mwss: 0.55, hwss: 0.55 };   // cells per generation, upper bound
const MEMORY = p => (SPEED[p.name] ? 30 : 6);                              // generations a lost pattern is remembered
let tracked = [];
function detect(silent = false) {
  const wrap = (a, b) => { const d = Math.abs(a - b); return Math.min(d, N - d); };
  const pool = tracked.slice(), next = [], added = {};
  for (const it of findPatterns()) {
    let best = -1, bd = Infinity;
    pool.forEach((p, i) => {
      if (p.name !== it.name) return;
      const d = Math.hypot(wrap(p.cx, it.cx), wrap(p.cy, it.cy));
      if (d < 2.6 + p.missed * (SPEED[p.name] || 0) && d < bd) { bd = d; best = i; }
    });
    if (best >= 0) {
      const p = pool.splice(best, 1)[0];
      p.cx = it.cx; p.cy = it.cy; p.size = it.size; p.missed = 0;
      next.push(p);
    } else {
      it.missed = 0;
      if (it.rank >= 5) it.glow = makeGlow(it);
      next.push(it);
      added[it.name] = (added[it.name] || 0) + 1;
      found[it.name] = (found[it.name] || 0) + 1;
      addScore(POINTS[it.rank]);
      if (!silent) celebrate(it);
    }
  }
  for (const p of pool) {                                // not seen this generation
    if (++p.missed <= MEMORY(p)) next.push(p);
    else if (p.glow) fading.push(p.glow);
  }
  tracked = next;
  for (const name in added) log(name, added[name]);
}

/* ---- input -> QR preview -> start ---- */
// the QR centred in an empty field: the Life seed
function seedFromQR(qr) {
  const g = qr.size + PAD * 2, cells = new Uint8Array(g * g);
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++)
    cells[(y + PAD) * g + x + PAD] = qr.modules[y * qr.size + x];
  return { cells, g };
}

// Typing updates the small QR and, live, shows the starting position on the board in pale cells.
// Nothing runs until "start"; typing during a game replaces it with the new preview.
function preview() {
  const bytes = enc.encode(text.value), c = qrCanvas.getContext("2d");
  pending = null;
  hintState.tooLong = 0;
  const max = QR.maxBytes(qrVersion(), 1);
  countEl.textContent = `${bytes.length} / ${max}`;
  countEl.classList.toggle("full", bytes.length >= max);
  if (!bytes.length) {
    qrCanvas.width = qrCanvas.height = 1;
    c.fillStyle = "#fff"; c.fillRect(0, 0, 1, 1);
    renderHint();
    if (demoWanted && startDemo()) return;                  // an empty box: the board shows the demo until the player types
    showPreview(null);
    return;
  }
  let qr;
  try { qr = QR.encode(bytes, 1, qrVersion()); }
  catch (e) { hintState.tooLong = QR.maxBytes(qrVersion(), 1); renderHint(); return; }
  pending = qr;
  demoWanted = false;                   // the player is typing: the demo has done its job
  endDemo();
  drawQR(qr);
  renderHint();
  showPreview(qr);
}
function drawQR(qr) {
  const c = qrCanvas.getContext("2d"), q = 4, n = qr.size + q * 2;     // with quiet zone
  qrCanvas.width = qrCanvas.height = n;
  c.fillStyle = "#fff"; c.fillRect(0, 0, n, n); c.fillStyle = "#000";
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++)
    if (qr.modules[y * qr.size + x]) c.fillRect(x + q, y + q, 1, 1);
}

function showPreview(qr) {
  const seedField = qr ? seedFromQR(qr) : { cells: new Uint8Array(45 * 45), g: 45 };
  load(seedField.cells, seedField.g, true);
  hasQR = false; running = false; holding = false;
  note.hidden = !!qr;
  syncButtons();
}

// always (re)starts from the text in the box
function start() {
  audioWake();
  if (!pending) { text.focus(); return; }
  demoWanted = false; endDemo();
  const { cells, g } = seedFromQR(pending);
  load(cells, g);
  hasQR = true; holding = false; running = true;
  note.hidden = true;
  syncButtons();
}

// never touches the best score or the ranking (see finish() and offerPost()). To show a more striking text, change only
// DEMO_TEXT (it has to fit the smallest board class: 14 bytes).
const DEMO_TEXT = "HELLO WORLD";

let last = 0, lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (t - (lastT || t)) / 1000);
  lastT = t;
  if (running && !holding && hasQR && t - last >= 1000 / FPS) { last = t; step(); draw(); }
  animateCells(dt);
  tickFx(dt);
  renderer.render(scene, camera);
}

// The box takes no more than the class's byte limit: whatever would go over (typing, paste, drop, a committed IME
// conversion) is cut at a character boundary and only the part that fits goes in. If the text is already over the limit
// (after switching to a smaller class) nothing can be added, but it can still be deleted or replaced by something shorter.
let lastValue = text.value;
const byteLen = str => enc.encode(str).length;
function enforceLimit() {
  const max = QR.maxBytes(qrVersion(), 1), now = text.value;
  if (byteLen(now) <= max || byteLen(now) <= byteLen(lastValue)) return;           // fits, or the edit did not add bytes
  // find what this edit changed: common prefix / suffix with the previous value
  let a = 0;
  while (a < lastValue.length && a < now.length && lastValue[a] === now[a]) a++;
  let b = 0;
  while (b < lastValue.length - a && b < now.length - a && lastValue[lastValue.length - 1 - b] === now[now.length - 1 - b]) b++;
  const isHigh = c => c >= 0xd800 && c <= 0xdbff, isLow = c => c >= 0xdc00 && c <= 0xdfff;
  if (a && isHigh(now.charCodeAt(a - 1))) a--;                                       // do not cut inside an emoji etc.
  if (b && isLow(now.charCodeAt(now.length - b))) b--;
  const head = now.slice(0, a), tail = now.slice(now.length - b), inserted = now.slice(a, now.length - b);
  const removed = lastValue.slice(a, lastValue.length - b);
  let room = max - (byteLen(lastValue) - byteLen(removed));                          // bytes the inserted part may use
  let kept = "";
  for (const ch of inserted) {                                                       // by whole characters
    const n = byteLen(ch);
    if (n > room) break;
    kept += ch; room -= n;
  }
  text.value = head + kept + tail;
  const caret = (head + kept).length;
  text.setSelectionRange(caret, caret);
}
function onTextChanged() {
  enforceLimit();
  lastValue = text.value;
  preview();
}
// Editing the text replaces the running game with a new preview, so ask first. A plain edit can be cancelled
// outright; an IME composition cannot, so a declined one is dropped when it ends.
let rejectComposition = false;
const confirmReset = () => !inGame() || confirm(T().confirmReset);
text.addEventListener("beforeinput", e => {
  if (e.isComposing || e.inputType === "insertCompositionText") return;
  if (!confirmReset()) e.preventDefault();
});
text.addEventListener("compositionstart", () => {
  if (confirmReset()) return;
  rejectComposition = true;
  text.blur();
});
text.addEventListener("input", e => {
  if (rejectComposition) return;
  if (e.isComposing) preview(); else onTextChanged();
});
text.addEventListener("compositionend", () => {
  if (rejectComposition) { rejectComposition = false; text.value = lastValue; return; }
  onTextChanged();
});
text.addEventListener("keydown", e => {
  // Enter while an IME is converting text only confirms the conversion
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); start(); }
});
goBtn.onclick = () => {                               // pause / resume a game in progress, else start one
  if (!inGame()) { start(); return; }
  running = !running;
  syncButtons();
};

$("again").onclick = () => { audioWake(); load(seed, N); holding = false; running = true; syncButtons(); };
guideBtn.onclick = () => guide.showModal();
$("guideClose").onclick = () => guide.close();
guide.addEventListener("click", e => { if (e.target === guide) guide.close(); });   // click on the backdrop
sndBtn.onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem("qrlife-sound", soundOn ? "on" : "off"); } catch (e) { /* ignore */ }
  audioWake();
  syncSound();
  if (soundOn) playRank(3);                           // short sample so the toggle gives feedback
};
langBtn.onclick = () => {
  const codes = Object.keys(I18N);
  lang = codes[(codes.indexOf(lang) + 1) % codes.length];
  try { localStorage.setItem("qrlife-lang", lang); } catch (e) { /* ignore */ }
  applyLang();
};
resetBtn.onclick = () => { if (inGame() && !confirm(T().confirmRestart)) return; audioWake(); load(seed, N); holding = false; running = true; syncButtons(); };

load(new Uint8Array(45 * 45), 45);   // empty board until the first start
applyLang();
preview();
requestAnimationFrame(frame);
</script>
</body>
</html>
