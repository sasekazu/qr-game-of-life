name: Firestore rules tests

# Runs the Security Rules tests (tests/rules) on the Firestore emulator.
# It runs on every push to feature/online-ranking and on pull requests into main, so the rules are checked before merging.
on:
  push:
    branches: [feature/online-ranking]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6          # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Cache the Firestore emulator jar
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('tests/rules/package-lock.json') }}

      - run: npm ci

      - name: Test the rules on the Firestore emulator
        run: npm test
